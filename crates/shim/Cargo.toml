[package]
name = "limen-shim"
version = "0.1.0"
edition = "2024"
description = "OpenAI-compatible shim in front of a local musegadget service"
license = "GPL-3.0-or-later"

[[bin]]
name = "limen-shim"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-core = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "sync", "io-util"] }
uuid = { version = "1", features = ["v4"] }
