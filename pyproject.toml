[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limen"
version = "0.1.0"
description = "Container image for the Muse Gadget Linux device service"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "pytest-cov", "ruff"]

[tool.isort]
known_first_party = ["limen"]
line_length = 100

[tool.mypy]
strict = true
files = ["src/limen/patch_subscribe.py", "src/limen/patch_network.py", "src/limen/patch_identity.py"]

[tool.pytest.ini_options]
testpaths = ["src/limen"]
addopts = "--cov --cov-fail-under=90 --cov-report=term-missing"

[tool.coverage.run]
source = ["src/limen"]
omit = ["test_*.py", "patch_network.py"]

[tool.coverage.report]
show_missing = true
