---
name: push

on: # yamllint disable-line rule:truthy
  workflow_dispatch: null
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  super-linter:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mv -vf .github/linters/biome.json .github/linters/commitlint.config.js ./
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ !contains(github.event_name, 'pull_request') }}
          VALIDATE_PYTHON_PYINK: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_PYLINT: false
          # PYTHON_MYPY deferred until phase-2 of the §21.7 migration; super-linter
          # invokes mypy per-file which can't reconcile sibling main.py files
          # under hyphenated tool dirs as separate modules.
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_GO: false
          # Biome already lints TypeScript here, and super-linter itself warns the
          # two conflict. ESLint additionally resolves imports, which fails on the
          # pi extensions: their imports come from pi's own runtime, so there is no
          # package.json to resolve them against and never will be.
          VALIDATE_TYPESCRIPT_ES: false
          # IGNORE_GITIGNORED_FILES dropped: super-linter 8.7.0 appends an
          # unsupported --gitignore flag to the jscpd/cpd binary when it's set,
          # crashing JSCPD. Removing it keeps copy-paste detection working.
          SAVE_SUPER_LINTER_OUTPUT: false
          MULTI_STATUS: false
          LOG_LEVEL: WARN
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.12
      - name: Run mypy --strict per Python project
        run: |
          set -euo pipefail
          # discover every project except the .venv-shadowed roots; each pyproject
          # owns its mypy scope via [tool.mypy] files = [...] so sibling main.py
          # files in adjacent projects don't collide as duplicate modules
          while IFS= read -r -d '' proj; do
            dir="$(dirname "$proj")"
            echo "::group::$dir"
            # --frozen installs the lock without checking it matches pyproject
            uv lock --check --project "$dir"
            uv sync --frozen --project "$dir"
            (cd "$dir" && uv run mypy --strict)
            echo "::endgroup::"
          done < <(find . -name pyproject.toml -not -path '*/.venv/*' -print0)
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.12
      - name: Run pytest with coverage per Python project
        run: |
          set -euo pipefail
          # same discovery as the mypy job; each pyproject owns its gate via
          # [tool.pytest.ini_options] addopts with --cov-fail-under=90 and
          # [tool.coverage.run] source limited to the project sources
          while IFS= read -r -d '' proj; do
            dir="$(dirname "$proj")"
            echo "::group::$dir"
            uv lock --check --project "$dir"
            uv sync --frozen --project "$dir"
            (cd "$dir" && uv run pytest)
            echo "::endgroup::"
          done < <(find . -name pyproject.toml -not -path '*/.venv/*' -print0)
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy with warnings denied
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test
  docker:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  notify:
    needs: [super-linter, mypy, pytest, rust]
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: prod
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      # workaround: dorny/paths-filter#240 — force pushes break paths-filter
      - id: parent
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            docs:
              - 'docs/**'
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        if: steps.filter.outputs.docs == 'true'
        with:
          token: ${{ secrets.REPOSITORY_DISPATCH_STREAMBINDER }}
          repository: streambinder/streambinder
          event-type: doc-sync
          client-payload: '{"repo": "${{ github.repository }}", "ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
